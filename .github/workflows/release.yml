name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string

env:
  GO_VERSION: '1.27.1'
  NODE_VERSION: '24.21.0'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  verify:
    name: Verify source and server build
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Provide an existing version tag, such as v0.0.3.5."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Build frontend
        working-directory: src/web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Test frontend
        working-directory: src/web
        run: npm test

      - name: Test Go packages
        working-directory: src
        run: go test ./...

      - name: Build server
        working-directory: src
        run: mkdir -p ../build && go build -trimpath -ldflags='-s -w' -o ../build/tangentry-server ./cmd/tangentry-server

  desktop:
    name: Build desktop packages
    needs: verify
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: src/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install macOS desktop build tools
        run: brew install ffmpeg whisper-cpp

      - name: Set desktop app version from tag
        run: echo "TANGENTRY_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Check updater signing secret
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::warning::MYGO_UPDATER_PRIVATE_KEY is not configured; desktop artifacts will be published without signed auto-update manifests."
          else
            echo "MyGo updater signing key is available."
            if [ ! -s src/updater/mygo-update.pub ]; then
              echo "::warning::src/updater/mygo-update.pub is missing; MyGo auto-update signing is not enabled and no update manifests will be generated."
            fi
          fi

      - name: Build all desktop targets
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: make desktop-build-all

      - name: Pack desktop release assets
        shell: bash
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets

          # Keep runtime files together with their application. Uploading
          # build/** directly creates duplicate release assets for every
          # platform's DLL, dylib, manifest, and license files.
          cp "build/darwin-arm64/Tangentry ${version} arm64.dmg" \
            "release-assets/Tangentry-${version}-macos-arm64.dmg"
          for target in windows-amd64 windows-arm64; do
            # MyGo puts the updater's tarball, deltas, and manifest beside the
            # runnable files. Keep those as top-level updater assets, but do
            # not put them inside the ZIP users extract and run.
            staging="$(mktemp -d)"
            for path in Tangentry.exe icon.png licenses runtime; do
              test -e "build/${target}/${path}" || {
                echo "Missing Windows package entry: build/${target}/${path}" >&2
                exit 1
              }
              cp -R "build/${target}/${path}" "${staging}/"
            done
            (
              cd "${staging}"
              zip -qr "${GITHUB_WORKSPACE}/release-assets/Tangentry-${version}-${target}.zip" .
            )
          done
          for target in linux-amd64 linux-arm64; do
            cp "build/${target}"/*.deb release-assets/
            cp "build/${target}"/*.tar.gz release-assets/
          done

          # MyGo's signed archives, deltas, and manifests must be top-level
          # release assets. They are not discoverable inside platform ZIPs.
          find build -type f \( \
            -name 'update-*.json' -o -name '*.delta' -o \
            -name '*-darwin-*.tar.gz' -o -name '*-windows-*.tar.gz' \
          \) -exec cp {} release-assets/ \;

          # Release page contains only intentional top-level artifacts.
          test -s "release-assets/Tangentry-${version}-macos-arm64.dmg"
          for target in windows-amd64 windows-arm64; do
            archive="release-assets/Tangentry-${version}-${target}.zip"
            test -s "$archive"
            unzip -Z1 "$archive" | grep -Fx 'Tangentry.exe' >/dev/null
            if unzip -Z1 "$archive" | grep -E '(^|/)(update-[^/]+\.json|[^/]+\.delta|[^/]+\.tar\.gz)$' >/dev/null; then
              echo "Windows install archive contains updater-only files: ${target}" >&2
              exit 1
            fi
          done
          for arch in amd64 arm64; do
            test -s "release-assets/tangentry_${version}_${arch}.deb"
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" -gt 0
          find release-assets -maxdepth 1 -type f -print | while read -r asset; do
            case "$asset" in
              *.dmg|*.zip|*.deb|*.tar.gz|*.delta|*/update-*.json) ;;
              *) echo "Unexpected release asset: $asset" >&2; exit 1 ;;
            esac
          done

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: tangentry-desktop-${{ env.RELEASE_TAG }}
          path: release-assets/*
          if-no-files-found: error

  docker:
    name: Publish Docker image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Set the DOCKERHUB_USERNAME repository secret."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Set the DOCKERHUB_TOKEN repository secret to a Docker Hub access token."; exit 1; }

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute release version
        id: version
        shell: bash
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/tangentry
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub release
    needs: [verify, desktop, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and release tags
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          name: tangentry-desktop-${{ env.RELEASE_TAG }}
          path: release-assets

      - name: Find previous release tag
        id: previous
        shell: bash
        run: |
          git fetch --force --tags
          previous="$(git tag --merged "${RELEASE_TAG}^" --list 'v*.*.*' --sort=-version:refname | head -n 1 || true)"
          echo "tag=${previous}" >> "$GITHUB_OUTPUT"

      - name: Compute release version
        id: version
        shell: bash
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare Chinese release notes
        env:
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ -s "$notes" ]; then
            cp "$notes" release-notes.md
          else
            printf '## 更新内容\n\n请查看本版本的提交记录。\n' > release-notes.md
          fi
          if [ -n "$PREVIOUS_TAG" ]; then
            printf '\n[完整变更记录](https://github.com/%s/compare/%s...%s)\n' \
              "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$RELEASE_TAG" >> release-notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: false
          draft: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: release-assets/*
